<!doctype html>
<html><head><meta charset="utf-8">
<style>
  :root { --glow: #4af1f2; --glow-soft: rgba(74, 241, 242, .55); --ink: #c9fbfb; --dim: rgba(74, 241, 242, .7);
          --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace; }
  html, body { margin: 0; width: 1200px; height: 630px; background: #000; overflow: hidden; font-family: var(--mono); color: var(--ink); }
  .brain { position: absolute; right: -210px; top: -112px; width: 1400px; height: 788px; background: url(brain.png) center / cover no-repeat; filter: saturate(1.15) brightness(1.18) contrast(1.05); }
  .shade { position: absolute; inset: 0; background:
      linear-gradient(90deg, #000 0%, rgba(0,0,0,.95) 28%, rgba(0,0,0,.6) 48%, rgba(0,0,0,0) 70%),
      linear-gradient(0deg, rgba(0,0,0,.85) 0%, rgba(0,0,0,0) 26%),
      linear-gradient(180deg, rgba(0,0,0,.75) 0%, rgba(0,0,0,0) 20%); }
  .scan { position: absolute; inset: 0; background: repeating-linear-gradient(0deg, rgba(74,241,242,.035) 0 1px, transparent 1px 3px); mix-blend-mode: screen; }
  .head { position: absolute; left: 64px; top: 54px; display: flex; align-items: center; gap: 22px; }
  .mark { width: 62px; color: var(--glow); filter: drop-shadow(0 0 3px var(--glow)) drop-shadow(0 0 14px var(--glow-soft)) drop-shadow(0 0 40px rgba(74,241,242,.35)); }
  .word { font-size: 30px; letter-spacing: .34em; font-weight: 500; text-shadow: 0 0 10px var(--glow-soft); }
  .by { font-size: 15px; letter-spacing: .3em; color: var(--dim); margin-top: 6px; }
  .big { position: absolute; left: 64px; top: 212px; width: 640px; font-size: 62px; line-height: 1.08; font-weight: 600; letter-spacing: -.01em; color: #eaffff; text-shadow: 0 0 22px rgba(74,241,242,.35); }
  .big em { font-style: normal; color: var(--glow); text-shadow: 0 0 18px var(--glow-soft); }
  .sub { position: absolute; left: 66px; top: 440px; width: 600px; font-size: 22px; line-height: 1.45; color: var(--ink); }
  .foot { position: absolute; left: 66px; bottom: 46px; font-size: 19px; letter-spacing: .12em; color: var(--glow); text-shadow: 0 0 8px var(--glow-soft); }
  .tag { position: absolute; right: 54px; bottom: 46px; font-size: 16px; letter-spacing: .1em; color: var(--dim); }
</style></head>
<body>
  <div class="brain"></div><div class="shade"></div><div class="scan"></div>
  <div class="head">
    <svg class="mark" viewBox="-1 -1 17 16"><g fill="currentColor" shape-rendering="crispEdges"><rect x="6" y="0" width="3" height="2"/><rect x="5" y="2" width="5" height="2"/><rect x="4" y="4" width="3" height="2"/><rect x="8" y="4" width="3" height="2"/><rect x="3" y="6" width="3" height="2"/><rect x="9" y="6" width="3" height="2"/><rect x="2" y="8" width="3" height="2"/><rect x="10" y="8" width="3" height="2"/><rect x="1" y="10" width="3" height="2"/><rect x="11" y="10" width="3" height="2"/><rect x="0" y="12" width="3" height="2"/><rect x="12" y="12" width="3" height="2"/></g></svg>
    <div><div class="word">CADANCE RADIO</div><div class="by">PRAGMA RESEARCH</div></div>
  </div>
  <div class="big">A deep brain that <em>hears</em>, <em>plans</em> and <em>plays</em>.</div>
  <div class="sub">Endless techno, written bar by bar by a real&#8209;time brain with a memory. Watch it think while it plays.</div>
  <div class="foot">cadance.floatingpragma.ai</div>
  <div class="tag">built with Cadence</div>
</body></html>
