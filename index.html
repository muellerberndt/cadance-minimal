<body>
<main id="stage">
  <canvas id="viz" aria-label="the visuals"></canvas>
  <canvas id="hero" aria-label="the brain: what it hears, plans and plays, and its memory"></canvas>
  <section id="devices" hidden aria-label="the devices of the track in front">
    <canvas id="devCanvas" aria-label="the drum machine and the three synth voices, playing the bar that sounds"></canvas>
  </section>
  <canvas id="djv" hidden aria-label="the Auto DJ's decks"></canvas>
  <div class="scan" aria-hidden="true"></div>

  <header class="brand">
    <div class="word">cad<span class="a">a</span>nce</div>
    <a class="by" href="https://floatingpragma.ai/" target="_blank" rel="noopener"><svg class="mark" viewBox="-1 -1 17 16" aria-hidden="true"><use href="#caret"/></svg>PRAGMA RESEARCH</a>
    <p class="claim">A human-like brain that <em>hears</em> and <em>composes</em> minimal techno.</p>
  </header>

  <div id="bigPlay"><button id="bigPlayB" aria-label="play"><span class="tri" aria-hidden="true"></span></button></div>

  <footer id="bar">
    <div class="controls">
      <button id="playB" class="ic" aria-label="play" title="play / pause (space)">&#9654;</button>
      <button id="nextB" class="ic" aria-label="next track" title="next track (n)">&#9197;</button>
      <label class="vol" title="volume"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2 6h3l4-3v10l-4-3H2z"/><path class="w" d="M11 5.5a3.5 3.5 0 0 1 0 5M12.8 3.6a6 6 0 0 1 0 8.8"/></svg><input id="volume" type="range" min="0" max="1" step="0.01" aria-label="volume"></label>
      <div id="views" class="views" role="group" aria-label="views (m: next)">
        <button class="ic" data-view="brain" aria-label="the brain" title="the brain"><svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="3" cy="8" r="1.6"/><circle cx="8" cy="3.5" r="1.6"/><circle cx="8" cy="12.5" r="1.6"/><circle cx="13" cy="8" r="1.6"/><path class="w" d="M3 8 8 3.5 13 8 8 12.5zM8 3.5v9M3 8h10"/></svg></button>
        <button class="ic" data-view="devices" aria-label="the devices" title="the devices"><svg viewBox="0 0 16 16" aria-hidden="true"><path class="w" d="M2 3h12v10H2z"/><rect x="4" y="5" width="2" height="2"/><rect x="7" y="5" width="2" height="2"/><rect x="10" y="9" width="2" height="2"/><rect x="4" y="9" width="2" height="2"/></svg></button>
        <button class="ic" data-view="mri" aria-label="MRI" title="MRI"><svg viewBox="0 0 16 16" aria-hidden="true"><path class="w" d="M8 2.5c3.4 0 5.5 2.3 5.5 5.3S11.4 13.5 8 13.5 2.5 10.8 2.5 7.8 4.6 2.5 8 2.5zM8 2.5v11M5 6c1 .8 1 2.5 0 3.4M11 6c-1 .8-1 2.5 0 3.4"/></svg></button>
        <button class="ic" data-view="dj" aria-label="the mixer" title="the mixer"><svg viewBox="0 0 16 16" aria-hidden="true"><path class="w" d="M4 2v12M8 2v12M12 2v12"/><rect x="2.5" y="9" width="3" height="2"/><rect x="6.5" y="4" width="3" height="2"/><rect x="10.5" y="7" width="3" height="2"/></svg></button>
        <button class="ic" data-view="more" aria-label="more views" title="more views"><svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="3.5" cy="8" r="1.4"/><circle cx="8" cy="8" r="1.4"/><circle cx="12.5" cy="8" r="1.4"/></svg></button>
      </div>
      <button id="calmB" class="ic" aria-label="calm" aria-pressed="false" title="calm"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M11.5 10.5A5 5 0 0 1 5.5 4.5a5 5 0 1 0 6 6z"/></svg></button>
      <button id="fullB" class="ic" aria-label="full screen" title="full screen (f)">&#9974;</button>
      <button id="gearB" class="ic" aria-label="settings" title="settings">&#9881;</button>
      <button id="helpB" class="ic" aria-label="what you are looking at" title="what you are looking at">?</button>
    </div>
    <nav class="links" aria-label="links">
      <a href="https://github.com/muellerberndt/cadance-minimal" target="_blank" rel="noopener">docs and source</a>
      <a href="https://github.com/muellerberndt/cadence/blob/main/docs/tutorials/minimal-techno.md" target="_blank" rel="noopener">tutorial</a>
      <a href="https://cadence.floatingpragma.ai/" target="_blank" rel="noopener">cadence</a>
    </nav>
  </footer>

  <section id="settings" class="panel" hidden aria-label="settings">
    <h2>settings</h2>
    <p id="radioState" class="state"></p>
    <label for="apiUrl">Live brain (server URL)</label>
    <input id="apiUrl" type="url" spellcheck="false" autocomplete="off" placeholder="empty: the radio plays the stored tracks">
    <p class="help">A server that hosts the Cadance neural network composes live; this page connects to it. <a href="https://github.com/muellerberndt/cadance-minimal/blob/main/docs/running.md#a-live-composer-for-the-radio-site" target="_blank" rel="noopener">How to run one</a></p>
    <p id="apiState" class="state"></p>
    <div class="row"><button id="apiSave">save</button><button id="apiClose">close</button></div>
  </section>

  <section id="tour" class="panel tour" hidden aria-live="polite" aria-label="tutorial">
    <p class="step"></p>
    <div class="body"></div>
    <div class="row"><button id="tourBack">back</button><button id="tourNext">next</button><button id="tourClose">close</button></div>
  </section>
  <div id="ring" hidden aria-hidden="true"></div>
